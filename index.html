function initAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.68;const limiter=audio.createDynamicsCompressor();limiter.threshold.value=-16;limiter.knee.value=12;limiter.ratio.value=3;limiter.attack.value=.008;limiter.release.value=.19;master.connect(limiter);limiter.connect(audio.destination);musicGain=audio.createGain();musicGain.gain.value=.9;musicGain.connect(master);fxGain=audio.createGain();fxGain.gain.value=.36;fxGain.connect(master);noiseBuffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.18),audio.sampleRate);let a=noiseBuffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}audio.resume()}

function scheduleBeat(i,t){if(muted)return;let beat=i%8,bar=Math.floor(i/8),chord=progression[bar%4];if(beat%2===0)kick(t);if(beat===2||beat===6)snare(t);hat(t,beat%2?.045:.07);if(beat%2===0)tone(chord[0]-12,t,musicGain,.23,.42,'soft');if(beat===0||beat===4){for(let n of chord)tone(n,t,musicGain,.075,1.05,'soft')}if(beat===3||beat===7)tone(chord[2]+12,t,musicGain,.055,.27,'soft');if(beat===1||beat===5)tone(chord[1]+12,t,musicGain,.028,.3,'soft')}
function hud(){$('#score').textContent=score;$('#combo').textContent=combo;$('#life').textContent='♥'.repeat(life)+'♡'.repeat(3-life)}function now(){return audio?audio.currentTime-startAt:0}async function start(){if(loading||playing)return;loading=true;try{initAudio();await audio.resume()}catch(e){$('#status').textContent='此瀏覽器無法啟用音效';loading=false;return}loading=false;build();cancelAnimationFrame(frame);session++;if(runBus)runBus.disconnect();runBus=audio.createGain();runBus.connect(master);musicGain.disconnect();fxGain.disconnect();musicGain=audio.createGain();fxGain=audio.createGain();musicGain.gain.value=muted?0:Number($('#backvol').value);fxGain.gain.value=Number($('#keyvol').value);musicGain.connect(runBus);fxGain.connect(runBus);score=0;combo=0;life=3;particles=[];ripples=[];judgement='';hud();playing=true;paused=false;nextAudioStep=0;nextVisual=0;lastTime=0;startAt=(audio?audio.currentTime:performance.now()/1000)+.16;if(custom){source=audio.createBufferSource();source.buffer=imported;source.connect(musicGain);source.start(startAt+2)}overlay.style.display='none';$('#pause').textContent='暫停';$('#status').textContent='演奏中 · '+BPM+' BPM';frame=requestAnimationFrame(draw)}

function tap(e){if(!playing||paused)return;e.preventDefault();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,lane=Math.min(3,Math.max(0,Math.floor(x/W*4))),time=now(),hitY=H*.81;let chosen=null,dist=1e9;for(const ev of events){if(ev.hit||ev.miss||ev.lane!==lane)continue;const center=hitY-(ev.time-time)/travel*H;const top=center-H*.13;const bottom=center+H*.02;const isInside=y>=top-25&&y<=bottom+25&&center>-H*.25&&center<H*1.15;const delta=Math.abs(ev.time-time);if(isInside&&delta<dist){chosen=ev;dist=delta}}if(!chosen)return;chosen.hit=true;const accuracy=Math.abs(chosen.time-time);const perfect=accuracy<.11;combo++;score+=(perfect?12:8)+Math.min(8,Math.floor(combo/10));if(score>best){best=score;try{localStorage.setItem('melody8best',best)}catch(e){}}hud();judgement=perfect?'✦ PERFECT ✦':'♪ GREAT';judgeUntil=performance.now()+430;sparkle(x,y);if(vibration&&navigator.vibrate)try{navigator.vibrate(perfect?12:8)}catch(e){}if(audio){const t=audio.currentTime+.004;if(custom){let s=audio.createBufferSource(),f=audio.createBiquadFilter(),v=audio.createGain();s.buffer=noiseBuffer;f.type='bandpass';f.frequency.value=2400;v.gain.setValueAtTime(.065,t);v.gain.exponentialRampToValueAtTime(.0001,t+.045);s.connect(f);f.connect(v);v.connect(fxGain);s.start(t);s.stop(t+.05)}else{tone(chosen.note,t,fxGain,.16,.52);}}}
function draw(ts){if(!playing||paused)return;const time=now(),dt=lastTime?Math.min((ts-lastTime)/1000,.05):.016;lastTime=ts;const beatPhase=((time/quarter)%1+1)%1;const pulse=Math.pow(1-beatPhase,7);g.clearRect(0,0,W,H);let bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#091329');bg.addColorStop(.55,'#1d1648');bg.addColorStop(1,'#3c155b');g.fillStyle=bg;g.fillRect(0,0,W,H);

$('#file').onchange=async e=>{const file=e.target.files[0];if(!file||playing||loading)return;loading=true;$('#start').disabled=true;$('#analysis').textContent='正在分析音樂…';try{if(file.size>60*1024*1024)throw Error('請選擇小於 60 MB 的檔案');initAudio();const buf=await audio.decodeAudioData(await file.arrayBuffer());if(buf.duration>600)throw Error('請選擇 10 分鐘內的歌曲');const hop=Math.max(1,Math.round(buf.sampleRate*.02)),a=buf.getChannelData(0),b=buf.numberOfChannels>1?buf.getChannelData(1):a,flux=[];let prev=0;for(let i=0;i<a.length;i+=hop){let sum=0;for(let j=i;j<Math.min(i+hop,a.length);j+=4){sum+=a[j]*a[j]+b[j]*b[j]}let en=Math.sqrt(sum/Math.max(1,hop/4));flux.push(Math.max(0,en-prev));prev=en}let times=[],last=-1;for(let i=3;i<flux.length-2;i++){let lo=Math.max(0,i-25),mean=0;for(let j=lo;j<i;j++)mean+=flux[j];mean/=i-lo;if(flux[i]>Math.max(.003,mean*2.1)&&flux[i]>=flux[i-1]&&flux[i]>=flux[i+1]&&i*.02-last>.24){last=i*.02;times.push(last)}}if(times.length<4)throw Error('找不到足夠清楚的節奏點，請換一首歌曲');let intervals=times.slice(1).map((t,i)=>t-times[i]).filter(t=>t>.28&&t<1.1).sort((a,b)=>a-b);let bpm=Math.round(60/(intervals[Math.floor(intervals.length/2)]||.5));while(bpm>180)bpm=Math.round(bpm/2);while(bpm<65)bpm*=2;imported=buf;chart={times,bpm};let opt=$('#song option[value="custom"]');if(!opt){opt=document.createElement('option');opt.value='custom';$('#song').appendChild(opt)}opt.textContent=file.name;$('#song').value='custom';$('#song').onchange()}catch(err){$('#analysis').textContent='無法匯入：'+(err.message||'格式不支援')}finally{loading=false;$('#start').disabled=false;e.target.value=''}};
$('#pause').onclick=()=>{if(!playing)return;paused=!paused;if(paused){pauseAt=audio?audio.currentTime:performance.now()/1000;cancelAnimationFrame(frame);if(audio)audio.suspend()}else{if(audio){audio.resume();}else startAt+=performance.now()/1000-pauseAt;lastTime=0;frame=requestAnimationFrame(draw)}$('#pause').textContent=paused?'繼續':'暫停';$('#status').textContent=paused?'已暫停':'演奏中'};$('#backvol').addEventListener('input',()=>{if(musicGain&&!muted)musicGain.gain.value=parseFloat($('#backvol').value)});$('#keyvol').addEventListener('input',()=>{if(fxGain)fxGain.gain.value=parseFloat($('#keyvol').value)});$('#music').onclick=()=>{muted=!muted;if(musicGain)musicGain.gain.value=muted?0:parseFloat($('#backvol').value);$('#music').textContent=muted?'♫ 伴奏關':'♫ 伴奏開'};$('#vibrate').onclick=()=>{vibration=!vibration;$('#vibrate').textContent=vibration?'震動開':'震動關'};document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;document.querySelectorAll('[data-diff]').forEach(v=>v.classList.toggle('selected',v===b))});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)$('#pause').click()});})();
