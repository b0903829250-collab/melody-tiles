<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090d23"><title>MELODY TILES 7.0</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080c1d;color:white;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center;align-items:center;padding:8px}.app{width:min(100%,460px);border:1px solid #5d6eb366;border-radius:22px;overflow:hidden;background:#111735;box-shadow:0 0 45px #5d3dce45}.header{padding:12px 14px;background:linear-gradient(110deg,#131d46,#44205b);display:flex;align-items:center;justify-content:space-between}.logo{font-size:14px;font-weight:900;letter-spacing:2px;color:#d7c4ff}.subtitle{font-size:10px;color:#aebce4}.scores{display:flex;gap:14px;text-align:right}.scores span{display:block;font-size:9px;color:#b6bfe3}.scores b{font-size:20px}.stage{height:min(115vw,570px);min-height:390px;position:relative;overflow:hidden;touch-action:none;background:#090f2b}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;z-index:5;background:#080d24e8;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:12px}.overlay h1{margin:0;font-size:30px;letter-spacing:1px}.overlay p{font-size:13px;color:#c6d0ec;line-height:1.75;margin:0}.overlay .emoji{font-size:48px}.button{border:0;border-radius:13px;background:linear-gradient(110deg,#ffcc6b,#ff8bd8);color:#221532;font-size:16px;font-weight:900;padding:13px 26px;cursor:pointer}.footer{display:flex;gap:8px;padding:11px;background:#151d3d;align-items:center;justify-content:space-between}.footer button{border:1px solid #6577ab55;border-radius:9px;background:#27345a;color:#fff;padding:9px 11px;font-size:12px;font-weight:700}.footer small{font-size:11px;color:#b8c5e8}.options{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.options button{background:#29375b;color:#fff;border:1px solid #6678af;border-radius:9px;padding:8px 12px;font-weight:700}.options button.selected{background:#a87cf0;color:#0c0a21}.meter{height:4px;background:#263051}.meter div{height:100%;width:0;background:linear-gradient(90deg,#68f4ff,#f8a5ff)}
.mix{display:flex;gap:12px;justify-content:space-around;padding:9px 14px 14px;background:#151d3d}.mix label{display:flex;align-items:center;gap:6px;font-size:12px;color:#d9e3ff}.mix input{width:88px;accent-color:#e4aaff}</style></head><body><main class="app"><div class="header"><div><div class="logo">✦ MELODY TILES 7.0</div><div class="subtitle">HARMONY EDITION</div></div><div class="scores"><div><span>SCORE</span><b id="score">0</b></div><div><span>COMBO</span><b id="combo">0</b></div><div><span>♥</span><b id="life">♥♥♥</b></div></div></div><div class="meter"><div id="meter"></div></div><section class="stage" id="stage"><canvas id="canvas"></canvas><div class="overlay" id="overlay"><div class="emoji">🎹</div><h1>HARMONY EDITION</h1><p>這次你演奏的是同一首原創歌曲的主旋律。<br>直接點擊下降中的黑色方塊即可發聲。<br>背景和弦與每個方塊都使用同一組和聲。<br>下方可調整伴奏和鋼琴音量。</p><div class="options"><button class="selected" data-diff="easy">輕鬆</button><button data-diff="normal">標準</button></div><button class="button" id="start">▶ 開始演奏</button><p id="best">最高分：0</p></div></section><div class="footer"><small id="status">準備演奏</small><button id="pause">暫停</button><button id="music">♫ 伴奏開</button><button id="vibrate">震動開</button></div><div class="mix"><label>🎼 伴奏 <input id="backvol" type="range" min="0" max="1.4" step="0.05" value="0.9"></label><label>🎹 鋼琴 <input id="keyvol" type="range" min="0" max="1" step="0.05" value="0.36"></label></div></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#canvas'),stage=$('#stage'),g=canvas.getContext('2d'),overlay=$('#overlay');let W=0,H=0,dpr=1;function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0)}resize();window.addEventListener('resize',resize);
const BPM=108,quarter=60/BPM,stepDur=quarter/2,travel=2.25;const chordRoots=[48,45,53,55],progression=[[48,52,55,59],[45,48,52,57],[53,57,60,64],[55,59,62,67]];const phrases=[[72,76,79,76,71,76,79,76],[72,76,81,76,69,72,76,72],[72,77,81,77,76,72,69,72],[74,79,83,79,74,71,67,71]];const patterns=[0,1,2,3,1,2,0,3,2,0,3,1,0,2,1,3];let events=[];for(let i=0;i<256;i++){const bar=Math.floor(i/8),root=chordRoots[bar%4];const pitch=phrases[bar%4][i%8];events.push({time:2+i*stepDur,lane:patterns[i%patterns.length],note:pitch,bar,root,hit:false,miss:false})}
let audio=null,master=null,musicGain=null,fxGain=null,noiseBuffer=null,playing=false,paused=false,muted=false,vibration=true,difficulty='easy',score=0,combo=0,life=3,best=0,startAt=0,pauseAt=0,nextAudioStep=0,nextVisual=0,frame=0,particles=[],ripples=[],judgement='',judgeUntil=0,lastTime=0,clockOffset=0,session=0;try{best=Number(localStorage.getItem('melody6best')||0)}catch(e){}$('#best').textContent='最高分：'+best;
function initAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.68;const limiter=audio.createDynamicsCompressor();limiter.threshold.value=-16;limiter.knee.value=12;limiter.ratio.value=3;limiter.attack.value=.008;limiter.release.value=.19;master.connect(limiter);limiter.connect(audio.destination);musicGain=audio.createGain();musicGain.gain.value=.9;musicGain.connect(master);fxGain=audio.createGain();fxGain.gain.value=.36;fxGain.connect(master);noiseBuffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.18),audio.sampleRate);let a=noiseBuffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}audio.resume()}
function tone(midi,t,dest,vol=.3,duration=.8,kind='piano'){if(!audio)return;const hz=440*Math.pow(2,(midi-69)/12);let out=audio.createGain();out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(vol,t+.009);out.gain.exponentialRampToValueAtTime(vol*.37,t+.12);out.gain.exponentialRampToValueAtTime(.0001,t+duration);out.connect(dest);const partials=kind==='piano'?[[1,1],[2,.27],[3,.095],[4,.035]]:[[1,1],[2,.12]];for(const [n,v] of partials){let osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(hz*n,t);gain.gain.value=v;osc.connect(gain);gain.connect(out);osc.start(t);osc.stop(t+duration+.02)}}
function kick(t){const o=audio.createOscillator(),a=audio.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.16);a.gain.setValueAtTime(.52,t);a.gain.exponentialRampToValueAtTime(.001,t+.23);o.connect(a);a.connect(musicGain);o.start(t);o.stop(t+.24)}
function hat(t,volume=.07){let s=audio.createBufferSource(),f=audio.createBiquadFilter(),a=audio.createGain();s.buffer=noiseBuffer;f.type='highpass';f.frequency.value=7000;a.gain.setValueAtTime(volume,t);a.gain.exponentialRampToValueAtTime(.0001,t+.065);s.connect(f);f.connect(a);a.connect(musicGain);s.start(t);s.stop(t+.07)}
function snare(t){let s=audio.createBufferSource(),f=audio.createBiquadFilter(),a=audio.createGain();s.buffer=noiseBuffer;f.type='highpass';f.frequency.value=1300;a.gain.setValueAtTime(.13,t);a.gain.exponentialRampToValueAtTime(.0001,t+.13);s.connect(f);f.connect(a);a.connect(musicGain);s.start(t);s.stop(t+.14)}
function scheduleBeat(i,t){if(muted)return;let beat=i%8,bar=Math.floor(i/8),chord=progression[bar%4];if(beat%2===0)kick(t);if(beat===2||beat===6)snare(t);hat(t,beat%2?.045:.07);if(beat%2===0)tone(chord[0]-12,t,musicGain,.23,.42,'soft');if(beat===0||beat===4){for(let n of chord)tone(n,t,musicGain,.075,1.05,'soft')}if(beat===3||beat===7)tone(chord[2]+12,t,musicGain,.055,.27,'soft');if(beat===1||beat===5)tone(chord[1]+12,t,musicGain,.028,.3,'soft')}
function hud(){$('#score').textContent=score;$('#combo').textContent=combo;$('#life').textContent='♥'.repeat(life)+'♡'.repeat(3-life)}function now(){return audio?audio.currentTime-startAt:0}function start(){try{initAudio()}catch(e){$('#status').textContent='此瀏覽器無法啟用音效'}cancelAnimationFrame(frame);session++;events.forEach(e=>{e.hit=false;e.miss=false});score=0;combo=0;life=3;particles=[];ripples=[];judgement='';hud();playing=true;paused=false;nextAudioStep=0;nextVisual=0;lastTime=0;startAt=(audio?audio.currentTime:performance.now()/1000)+.16;overlay.style.display='none';$('#pause').textContent='暫停';$('#status').textContent='演奏中 · 108 BPM';frame=requestAnimationFrame(draw)}
function finish(){playing=false;cancelAnimationFrame(frame);overlay.style.display='flex';overlay.innerHTML='<div class="emoji">🏆</div><h1>演奏結束</h1><p>本次得分 '+score+'<br>最高紀錄 '+best+'</p><button class="button" id="again">↻ 再玩一次</button>';$('#again').onclick=start;$('#status').textContent='演奏結束'}
function miss(e){if(e.hit||e.miss)return;e.miss=true;combo=0;life--;judgement='MISS';judgeUntil=performance.now()+550;hud();if(life<=0)finish()}
function sparkle(x,y){for(let i=0;i<22;i++){let a=Math.random()*Math.PI*2,v=40+Math.random()*190;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.55+Math.random()*.35,hue:185+Math.random()*135})}ripples.push({x,y,r:4,life:.48})}
function tap(e){if(!playing||paused)return;e.preventDefault();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,lane=Math.min(3,Math.max(0,Math.floor(x/W*4))),time=now(),hitY=H*.81;let chosen=null,dist=1e9;for(const ev of events){if(ev.hit||ev.miss||ev.lane!==lane)continue;const center=hitY-(ev.time-time)/travel*H;const top=center-H*.13;const bottom=center+H*.02;const isInside=y>=top-25&&y<=bottom+25&&center>-H*.25&&center<H*1.15;const delta=Math.abs(ev.time-time);if(isInside&&delta<dist){chosen=ev;dist=delta}}if(!chosen)return;chosen.hit=true;const accuracy=Math.abs(chosen.time-time);const perfect=accuracy<.11;combo++;score+=(perfect?12:8)+Math.min(8,Math.floor(combo/10));if(score>best){best=score;try{localStorage.setItem('melody6best',best)}catch(e){}}hud();judgement=perfect?'✦ PERFECT ✦':'♪ GREAT';judgeUntil=performance.now()+430;sparkle(x,y);if(vibration&&navigator.vibrate)try{navigator.vibrate(perfect?12:8)}catch(e){}if(audio){const t=audio.currentTime+.004;tone(chosen.note,t,fxGain,.24,.62);tone(chosen.note-12,t,fxGain,.018,.22,'soft')}}
function draw(ts){if(!playing||paused)return;const time=now(),dt=lastTime?Math.min((ts-lastTime)/1000,.05):.016;lastTime=ts;const beatPhase=((time/quarter)%1+1)%1;const pulse=Math.pow(1-beatPhase,7);g.clearRect(0,0,W,H);let bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#091329');bg.addColorStop(.55,'#1d1648');bg.addColorStop(1,'#3c155b');g.fillStyle=bg;g.fillRect(0,0,W,H);
for(let i=0;i<42;i++){let x=(i*73.71%W+W)%W,y=(i*139.3+time*(8+i%5*5))%H;g.fillStyle='rgba(176,211,255,'+(.13+(i%4)*.1)+')';g.beginPath();g.arc(x,y,i%6===0?2:1,0,7);g.fill()}
for(let i=0;i<4;i++){g.fillStyle=i%2?'#ffffff07':'#ffffff03';g.fillRect(i*W/4,0,W/4,H);g.strokeStyle='#8ab8ff35';g.lineWidth=1;g.beginPath();g.moveTo(i*W/4,0);g.lineTo(i*W/4,H);g.stroke();let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#53baff00');grad.addColorStop(1,'#8b5cff1a');g.fillStyle=grad;g.fillRect(i*W/4,0,W/4,H)}
for(let i=0;i<9;i++){let y=(i*H/8+time*50)%H;g.strokeStyle='#a8b5ff13';g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
const hitY=H*.81;g.shadowColor='#ffcf75';g.shadowBlur=16+24*pulse;g.fillStyle='#ffdb8a';g.fillRect(0,hitY-2,W,4);g.shadowBlur=0;g.fillStyle='#ffcc7540';g.fillRect(0,hitY-15,W,31);
for(const ev of events){if(ev.hit||ev.miss)continue;const center=hitY-(ev.time-time)/travel*H;if(center<-H*.2||center>H*1.15)continue;const x=ev.lane*W/4+5,y=center-H*.13,w=W/4-10,h=H*.15;const grad=g.createLinearGradient(x,y,x+w,y+h);grad.addColorStop(0,'#1e2c53');grad.addColorStop(1,'#070d20');g.shadowColor='#9d82ff';g.shadowBlur=14;g.fillStyle=grad;g.beginPath();g.roundRect(x,y,w,h,9);g.fill();g.shadowBlur=0;g.strokeStyle='#b7a2ff';g.lineWidth=2;g.stroke();g.fillStyle='#c5eaff';g.font='bold 23px system-ui';g.textAlign='center';g.fillText('♪',x+w/2,y+h/2+8);if(time>ev.time+(difficulty==='easy'?.43:.27))miss(ev);if(!playing)return}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=95*dt;p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}g.fillStyle='hsla('+p.hue+',100%,75%,'+Math.min(1,p.life*1.5)+')';g.beginPath();g.arc(p.x,p.y,2.5,0,7);g.fill()}
for(let i=ripples.length-1;i>=0;i--){let p=ripples[i];p.life-=dt;p.r+=260*dt;if(p.life<=0){ripples.splice(i,1);continue}g.strokeStyle='rgba(255,217,142,'+p.life*1.6+')';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.stroke()}
if(performance.now()<judgeUntil){g.textAlign='center';g.font='900 27px system-ui';g.shadowColor='#e78dff';g.shadowBlur=20;g.fillStyle=judgement==='MISS'?'#ff829a':'#ffe08e';g.fillText(judgement,W/2,H*.25);g.shadowBlur=0}if(combo>=10){g.textAlign='center';g.fillStyle='#e3b6ff';g.font='bold 14px system-ui';g.fillText(combo+' COMBO ✦',W/2,H*.32)}$('#meter').style.width=(beatPhase*100)+'%';
if(audio){while(nextAudioStep*stepDur+2<time+.12){nextAudioStep++}while(nextAudioStep*stepDur+2<=time+.16&&nextAudioStep<256){scheduleBeat(nextAudioStep,startAt+2+nextAudioStep*stepDur);nextAudioStep++}}if(time>events[events.length-1].time+1.5){finish();return}frame=requestAnimationFrame(draw)}
canvas.addEventListener('pointerdown',tap,{passive:false});$('#start').onclick=start;$('#pause').onclick=()=>{if(!playing)return;paused=!paused;if(paused){pauseAt=audio?audio.currentTime:performance.now()/1000;cancelAnimationFrame(frame);if(audio)audio.suspend()}else{if(audio){audio.resume();startAt+=audio.currentTime-pauseAt}else startAt+=performance.now()/1000-pauseAt;lastTime=0;frame=requestAnimationFrame(draw)}$('#pause').textContent=paused?'繼續':'暫停';$('#status').textContent=paused?'已暫停':'演奏中'};$('#backvol').addEventListener('input',()=>{if(musicGain&&!muted)musicGain.gain.value=parseFloat($('#backvol').value)});$('#keyvol').addEventListener('input',()=>{if(fxGain)fxGain.gain.value=parseFloat($('#keyvol').value)});$('#music').onclick=()=>{muted=!muted;if(musicGain)musicGain.gain.value=muted?0:parseFloat($('#backvol').value);$('#music').textContent=muted?'♫ 伴奏關':'♫ 伴奏開'};$('#vibrate').onclick=()=>{vibration=!vibration;$('#vibrate').textContent=vibration?'震動開':'震動關'};document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;document.querySelectorAll('[data-diff]').forEach(v=>v.classList.toggle('selected',v===b))});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)$('#pause').click()});})();
</script></body></html>
